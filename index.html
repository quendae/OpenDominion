7);transition:transform .17s ease,box-shadow .17s ease,filter .17s ease}.card.buyable,.card.playable{outline:2px solid rgba(215,180,94,.75);box-shadow:0 0 0 3px rgba(215,180,94,.12),0 12px 28px rgba(0,0,0,.33)}.card.buyable:hover,.card.playable:hover{transform:translateY(-9px)}.card h4{font-family:Georgia,serif;margin:0 34px 8px 0;font-size:15px}.card .type{font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:#68716d;font-weight:800}.card .rules{font-size:10px;line-height:1.28;margin-top:14px;color:#39423e}.cost{position:absolute;right:8px;bottom:8px;width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(var(--gold2),#bd9137);font-family:Georgia,serif;font-weight:900}.card.treasure{border-top:8px solid #b97745}.card.victory{border-top:8px solid #548663}.card.curse{border-top:8px solid #7d627f}.card.action{border-top:8px solid #8aa6af}.card.attack{border-top-color:#b85b58}.card.reaction{border-top-color:#6991b8}.pile.just-bought .card{animation:purchaseFlash .65s ease}.pile.just-bought .count{animation:countPop .5s ease}.play-area{margin-top:16px;min-height:172px;border:1px solid var(--line);border-radius:18px;padding:13px;background:rgba(3,27,18,.24)}.played{display:flex;flex-wrap:wrap;gap:7px}.played .card{width:98px;min-height:132px;transform:scale(.9);transform-origin:top left}.played .card:last-child{animation:cardLand .38s cubic-bezier(.2,.9,.25,1.2)}.hand-zone{margin-top:16px}.hand{display:flex;justify-content:center;align-items:flex-end;min-height:174px;padding-top:22px}.hand .card{width:114px;min-width:114px;margin-left:-22px;transform:rotate(var(--rot,0deg)) translateY(var(--drop,0));transform-origin:50% 100%;animation:handDeal .32s ease both;animation-delay:var(--delay,0ms)}.hand .card:first-child{margin-left:0}.hand .card.playable:hover{transform:rotate(var(--rot,0deg)) translateY(-16px)}.players{display:flex;flex-direction:column;gap:9px}.player-seat{background:linear-gradient(135deg,#16241d,#0d1511);border:1px solid rgba(241,215,130,.18);border-radius:14px;padding:12px;box-shadow:0 12px 28px rgba(0,0,0,.25);transition:.25s ease}.player-seat.active{border-color:var(--gold);box-shadow:0 0 0 1px rgba(215,180,94,.25),0 0 28px rgba(215,180,94,.12);animation:seatGlow 1.8s ease-in-out infinite}.player-seat h4{font-family:Georgia,serif;margin:0 0 5px}.seat-meta{color:var(--muted);font-size:11px}.seat-score{margin-top:7px;font-size:12px;color:#f4d9a1}.supply-note{margin-top:auto;color:var(--muted);font-size:11px;line-height:1.4}.turn-dock{position:fixed;z-index:35;left:281px;right:16px;bottom:14px;min-height:82px;border:1px solid rgba(241,215,130,.28);border-radius:18px;background:linear-gradient(180deg,rgba(17,26,22,.96),rgba(8,17,13,.98));box-shadow:0 20px 60px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.04);backdrop-filter:blur(12px);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:10px 14px}.resources{display:flex;gap:8px}.resource{min-width:86px;border:1px solid var(--line);border-radius:12px;background:#132019;padding:8px 11px}.resource span{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.13em;font-size:8px;font-weight:800}.resource b{display:block;font-family:Georgia,serif;font-size:22px;line-height:1.05;margin-top:2px}.resource.coins{border-color:rgba(215,180,94,.45);background:linear-gradient(135deg,rgba(90,66,22,.48),#132019)}.resource.pulse{animation:resourcePulse .55s ease}.dock-status{min-width:0}.phase-chip{display:inline-flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:var(--gold2);animation:phaseIn .3s ease}.phase-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}.dock-status p{margin:4px 0 0;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dock-actions{display:flex;gap:8px;align-items:center}.btn.treasure{border-color:rgba(215,180,94,.45);background:linear-gradient(#4a3822,#2b251c)}.tutorial-panel{position:fixed;right:24px;top:98px;z-index:42;width:min(350px,calc(100vw - 48px));border:1px solid rgba(215,180,94,.55);border-radius:18px;background:linear-gradient(155deg,#19271f,#0b1510);box-shadow:0 24px 70px rgba(0,0,0,.48);padding:16px;animation:tutorialIn .3s ease}.tutorial-panel .step{color:var(--gold2);font-size:9px;text-transform:uppercase;letter-spacing:.16em;font-weight:900}.tutorial-panel h3{font-family:Georgia,serif;margin:5px 0 7px;font-size:21px}.tutorial-panel p{color:#c1cec5;font-size:12px;line-height:1.5;margin:0}.tutorial-panel .tutorial-actions{display:flex;justify-content:space-between;gap:8px;margin-top:12px}.tutorial-focus{position:relative;z-index:4;outline:3px solid var(--gold)!important;box-shadow:0 0 0 6px rgba(215,180,94,.14),0 0 35px rgba(215,180,94,.4)!important;animation:tutorialPulse 1.2s ease-in-out infinite!important}.tutorial-blocked{filter:saturate(.45) brightness(.65);pointer-events:none}.tutorial-badge{display:inline-block;margin-top:10px;padding:5px 8px;border-radius:999px;border:1px solid rgba(215,180,94,.3);color:var(--gold2);font-size:10px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(9px);display:grid;place-items:center;padding:20px;z-index:70}.modal{width:min(720px,96vw);max-height:90vh;overflow:auto;background:linear-gradient(#17231d,#0d1511);border:1px solid rgba(215,180,94,.36);border-radius:22px;padding:24px;box-shadow:var(--shadow);animation:modalIn .25s ease}.modal h2{font-family:Georgia,serif;font-size:30px;margin:4px 0 10px}.modal p{color:var(--muted);line-height:1.5}.setup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.choice{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);text-align:left}.choice.selected{border-color:var(--gold);box-shadow:0 0 0 1px rgba(215,180,94,.25)}.setup-actions{display:flex;gap:10px;flex-wrap:wrap}.target-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.target-card{border:1px solid var(--line);background:#142019;border-radius:12px;padding:12px;color:var(--ink);text-align:left}.target-card:hover{border-color:var(--gold)}.result-list{display:grid;gap:8px;margin:18px 0}.result-row{display:flex;justify-content:space-between;padding:10px 12px;background:rgba(255,255,255,.04);border-radius:10px}.result-row.winner{outline:1px solid var(--gold)}.toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:#0d1511;border:1px solid var(--gold);padding:10px 14px;border-radius:999px;z-index:80;box-shadow:0 12px 30px rgba(0,0,0,.4);font-size:12px;animation:toastIn .25s ease}@keyframes handDeal{from{opacity:0;transform:translateY(28px) rotate(var(--rot,0deg)) scale(.9)}to{opacity:1;transform:rotate(var(--rot,0deg)) translateY(var(--drop,0)) scale(1)}}@keyframes cardLand{0%{opacity:.2;transform:translateY(36px) rotate(6deg) scale(.76)}70%{transform:translateY(-4px) rotate(-1deg) scale(.94)}100%{opacity:1;transform:scale(.9)}}@keyframes purchaseFlash{0%,100%{filter:none}40%{filter:brightness(1.22);box-shadow:0 0 0 5px rgba(215,180,94,.18),0 0 35px rgba(215,180,94,.42)}}@keyframes countPop{50%{transform:scale(1.3);background:var(--gold);color:#15140e}}@keyframes seatGlow{50%{box-shadow:0 0 0 1px rgba(215,180,94,.38),0 0 38px rgba(215,180,94,.2)}}@keyframes resourcePulse{50%{transform:scale(1.08);border-color:var(--gold);box-shadow:0 0 24px rgba(215,180,94,.28)}}@keyframes phaseIn{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}@keyframes tutorialIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}@keyframes tutorialPulse{50%{box-shadow:0 0 0 8px rgba(215,180,94,.12),0 0 42px rgba( a',cost:3,type:['action'],cards:1,actions:2,text:'+1 karta · +2 akcje'},smithy:{name:'Kowal',cost:4,type:['action'],cards:3,text:'+3 karty'},market:{name:'Targ',cost:5,type:['action'],cards:1,actions:1,buys:1,coins:1,text:'+1 karta · +1 akcja · +1 zakup · +1 moneta'},militia:{name:'Milicja',cost:4,type:['action','attack'],coins:2,text:'+2 monety · inni odrzucają do 3 kart'},moat:{name:'Fosa',cost:2,type:['action','reaction'],cards:2,text:'+2 karty · blokuje ataki'},remodel:{name:'Przebudowa',cost:4,type:['action'],text:'Usuń kartę z ręki; zdobądź kartę kosztującą do +2 więcej',effect:'remodel'},workshop:{name:'Warsztat',cost:3,type:['action'],text:'Zdobądź kartę kosztującą do 4',effect:'workshop'},festival:{name:'Festiwal',cost:5,type:['action'],actions:2,buys:1,coins:2,text:'+2 akcje · +1 zakup · +2 monety'},laboratory:{name:'Laboratorium',cost:5,type:['action'],cards:2,actions:1,text:'+2 karty · +1 akcja'},mine:{name:'Kopalnia',cost:5,type:['action'],text:'Usuń skarb z ręki; zdobądź skarb kosztujący do +3 więcej do ręki',effect:'mine'}};const KINGDOM=['village','smithy','market','militia','moat','remodel','workshop','festival','laboratory','mine'];const BASIC=['copper','silver','gold','estate','duchy','province','curse'];const state={players:[],supply:{},trash:[],turn:0,round:1,phase:'action',actions:1,buys:1,coins:0,log:[],started:false,busy:false,pending:null,lastBought:null,pulse:null,tutorial:null};let setupPlayers=3;let toastTimer=null;function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}function log(msg){state.log.unshift(msg);state.log=state.log.slice(0,80)}function current(){return state.players[state.turn]}function initSupply(n){state.supply={};const victory=n===2?8:12,curse=(n-1)*10;Object.assign(state.supply,{copper:60-n*7,silver:40,gold:30,estate:victory,duchy:victory,province:victory,curse});KINGDOM.forEach(id=>state.supply[id]=10)}function makePlayer(name,bot){const deck=shuffle([ e.started)return;const p=current();p.discard.push(...p.hand.splice(0),...p.play.splice(0));draw(p,5);const reason=endGameReason();if(reason&&!state.tutorial){showResults(reason);return}if(state.tutorial&&state.tutorial.step===5&&state.turn===0){state.turn=1;state.tutorial.step=6;state.busy=true;log('Porządki: odrzucasz rękę i karty zagrane, następnie dobierasz 5 nowych.');render();setTimeout(tutorialBotTurn,1500);return}state.turn=(state.turn+1)%state.players.length;if(state.turn===0)state.round++;beginTurn();render()}function nextPhase(){if(state.busy||current().bot)return;if(state.tutorial&&state.tutorial.step!==2&&state.tutorial.step!==5){toast('W samouczku wykonaj najpierw podświetlony krok.');return}if(state.phase==='action'){state.phase='buy';log('Przechodzisz do fazy zakupów.');if(state.tutorial)state.tutorial.step=3;render();toast('Faza zakupów: skarby zagrywasz samodzielnie.')}else if(state.phase==='buy'){if(state.tutorial)state.tutorial.step=5;state.phase='cleanup';render();setTimeout(cleanup,320)}}function playTreasure(index){const p=current();if(p.bot||state.busy||state.phase!=='buy')return;const id=p.hand[index],c=CARD[id];if(!c||!c.type.includes('treasure'))return;if(state.tutorial&&state.tutorial.step!==3){toast('W samouczku skorzystaj teraz z „Zagraj wszystkie”.');return}p.hand.splice(index,1);p.play.push(id);state.coins+=c.coins||0;state.pulse='coins';log(`${p.name} zagrywa „${c.name}” (+${c.coins} monet).`);render();setTimeout(clearPulse,560)}function playAllTreasures(){const p=current();if(p.bot||state.busy||state.phase!=='buy')return;if(state.tutorial&&state.tutorial.step!==3){toast('Jeszcze nie ten krok samouczka.');return}const treasures=p.hand.map((id,i)=>({id,i})).filter(x=>CARD[x.id].type.includes('treasure'));if(!treasures.length){toast('Nie masz skarbów na ręce.');return}let gained=0;for(let i=p.hand.length-1;i>=0;i--){const id=p.hand[i];if(CARD[id].type.includes('treasure')){p.hand.splice(i,1);p.play.push(id);gained+=CARD[id].coins||0}}st
