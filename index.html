<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#08110d" />
  <title>OpenDominion</title>
  <style>
:root{--bg:#08110d;--panel:#111a16;--panel2:#17231d;--felt:#176a48;--felt2:#0e4932;--wood:#74492d;--gold:#d7b45e;--gold2:#f1d782;--ink:#edf5ef;--muted:#97aa9f;--line:rgba(255,255,255,.11);--ivory:#f5f1e8;--danger:#b84a4a;--shadow:0 24px 70px rgba(0,0,0,.45)}
*{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;font-family:Inter,system-ui,Segoe UI,sans-serif;background:linear-gradient(#0a1510,#060c09);color:var(--ink)}button,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.app{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 25%,rgba(44,121,84,.18),transparent 36%),var(--bg)}
.topbar{min-height:92px;display:grid;grid-template-columns:minmax(250px,1fr) auto auto;gap:18px;align-items:center;padding:14px 22px;background:#0a1510;border-bottom:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.2);z-index:10}.brand small,.eyebrow{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.brand h1{margin:2px 0 0;font-family:Georgia,'Times New Roman',serif;font-size:28px;letter-spacing:.08em;color:var(--gold2)}
.stats{display:flex;gap:8px}.stat{min-width:86px;padding:9px 12px;border:1px solid var(--line);background:var(--panel);border-radius:12px}.stat b{display:block;font-family:Georgia,serif;font-size:20px}.stat.active{border-color:rgba(215,180,94,.65);box-shadow:0 0 0 1px rgba(215,180,94,.16),0 0 25px rgba(215,180,94,.08)}
.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);border-radius:11px;padding:10px 14px;background:linear-gradient(#2a4035,#21332a);color:var(--ink);font-weight:800;font-size:12px;letter-spacing:.04em}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.primary{background:linear-gradient(var(--gold2),#bd9137);color:#15140e;border-color:#f1d782}.btn.ghost{background:transparent}.btn.danger{background:rgba(120,31,31,.35);color:#ffc5c5}.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.main{flex:1;display:grid;grid-template-columns:270px minmax(0,1fr);min-height:0}.sidebar{background:linear-gradient(180deg,#111a16,#0d1511);border-right:1px solid var(--line);padding:22px;overflow:auto}.sidebar h2{font-family:Georgia,serif;margin:6px 0 8px}.sidebar p{color:var(--muted);font-size:13px;line-height:1.45}.phase-actions{display:grid;gap:9px;margin:18px 0}.log{margin-top:24px}.log-items{display:flex;flex-direction:column;gap:8px;max-height:48vh;overflow:auto;padding-right:4px}.log-item{font-size:12px;color:#c9d3cc;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.board-shell{position:relative;min-width:0;background:linear-gradient(var(--wood),#50301e 12px,var(--felt) 12px,var(--felt2));padding:18px;overflow:auto}.board{min-width:900px;min-height:calc(100vh - 128px);border:1px solid rgba(255,255,255,.10);border-radius:22px;background:radial-gradient(circle at 50% 18%,rgba(255,242,188,.07),transparent 26%),radial-gradient(circle at 50% 50%,#20845a,#176a48 52%,#0e4932 78%,#093424);box-shadow:inset 0 0 90px rgba(0,0,0,.35),var(--shadow);padding:22px;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px}.market h3,.hand-title,.play-title{margin:0 0 10px;color:var(--gold2);font-size:11px;letter-spacing:.14em;text-transform:uppercase}.piles{display:grid;grid-template-columns:repeat(5,minmax(118px,1fr));gap:12px}.basic-piles{margin-top:14px;grid-template-columns:repeat(7,minmax(100px,1fr))}.pile{position:relative}.count{position:absolute;right:7px;top:7px;z-index:2;background:#0c1712;color:var(--ink);border:1px solid var(--line);border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:11px;font-weight:900}.card{position:relative;min-height:158px;border-radius:12px;border:1px solid #c9cfcb;background:linear-gradient(145deg,#fff,#f2f1ec 67%,#e4e1d9);color:#171b19;padding:12px;box-shadow:0 9px 22px rgba(0,0,0,.26),inset 0 1px rgba(255,255,255,.7);transition:.15s ease}.card.buyable,.card.playable{outline:2px solid rgba(215,180,94,.75);box-shadow:0 0 0 3px rgba(215,180,94,.12),0 12px 28px rgba(0,0,0,.33)}.card.buyable:hover,.card.playable:hover{transform:translateY(-8px)}.card h4{font-family:Georgia,serif;margin:0 36px 8px 0;font-size:16px}.card .type{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#68716d;font-weight:800}.card .rules{font-size:11px;line-height:1.25;margin-top:15px;color:#39423e}.cost{position:absolute;right:8px;bottom:8px;width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(var(--gold2),#bd9137);font-family:Georgia,serif;font-weight:900}.card.treasure{border-top:8px solid #b97745}.card.victory{border-top:8px solid #548663}.card.curse{border-top:8px solid #7d627f}.card.action{border-top:8px solid #8aa6af}.card.attack{border-top-color:#b85b58}.card.reaction{border-top-color:#6991b8}
.play-area{margin-top:18px;min-height:185px;border:1px solid var(--line);border-radius:18px;padding:14px;background:rgba(3,27,18,.24)}.played{display:flex;flex-wrap:wrap;gap:9px}.played .card{width:98px;min-height:136px;transform:scale(.92);transform-origin:top left}.hand-zone{margin-top:18px}.hand{display:flex;justify-content:center;align-items:flex-end;min-height:180px;padding-top:24px}.hand .card{width:118px;min-width:118px;margin-left:-22px;transform:rotate(var(--rot,0deg)) translateY(var(--drop,0));transform-origin:50% 100%}.hand .card:first-child{margin-left:0}.hand .card.playable:hover{transform:rotate(var(--rot,0deg)) translateY(-16px)}
.players{display:flex;flex-direction:column;gap:10px}.player-seat{background:linear-gradient(135deg,#16241d,#0d1511);border:1px solid rgba(241,215,130,.18);border-radius:14px;padding:12px;box-shadow:0 12px 28px rgba(0,0,0,.25)}.player-seat.active{border-color:var(--gold);box-shadow:0 0 0 1px rgba(215,180,94,.25),0 0 28px rgba(215,180,94,.12)}.player-seat h4{font-family:Georgia,serif;margin:0 0 5px}.seat-meta{color:var(--muted);font-size:11px}.seat-score{margin-top:7px;font-size:12px;color:#f4d9a1}.supply-note{margin-top:auto;color:var(--muted);font-size:11px;line-height:1.4}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(9px);display:grid;place-items:center;padding:20px;z-index:50}.modal{width:min(720px,96vw);max-height:90vh;overflow:auto;background:linear-gradient(#17231d,#0d1511);border:1px solid rgba(215,180,94,.36);border-radius:22px;padding:24px;box-shadow:var(--shadow)}.modal h2{font-family:Georgia,serif;font-size:30px;margin:4px 0 10px}.modal p{color:var(--muted);line-height:1.5}.setup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.choice{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);text-align:left}.choice.selected{border-color:var(--gold);box-shadow:0 0 0 1px rgba(215,180,94,.25)}.target-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.target-card{border:1px solid var(--line);background:#142019;border-radius:12px;padding:12px;color:var(--ink);text-align:left}.target-card:hover{border-color:var(--gold)}.result-list{display:grid;gap:8px;margin:18px 0}.result-row{display:flex;justify-content:space-between;padding:10px 12px;background:rgba(255,255,255,.04);border-radius:10px}.result-row.winner{outline:1px solid var(--gold)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0d1511;border:1px solid var(--gold);padding:10px 14px;border-radius:999px;z-index:80;box-shadow:0 12px 30px rgba(0,0,0,.4);font-size:12px}
@media(max-width:1100px){.topbar{grid-template-columns:1fr auto}.top-actions{display:none}.main{grid-template-columns:1fr}.sidebar{order:2;border-right:0;border-top:1px solid var(--line)}.board-shell{order:1}.board{min-height:780px}.piles{grid-template-columns:repeat(5,130px)}.basic-piles{grid-template-columns:repeat(7,110px)}}
@media(max-width:720px){.topbar{grid-template-columns:1fr}.stats{overflow:auto}.brand h1{font-size:23px}.board-shell{padding:10px}.board{grid-template-columns:1fr;min-width:760px}.players{display:grid;grid-template-columns:repeat(3,1fr)}.sidebar{padding:16px}.hand .card{width:86px;min-width:86px;min-height:132px;margin-left:-20px}.card h4{font-size:13px}.card .rules{font-size:9px}.setup-grid{grid-template-columns:1fr}}
  </style>

<body>
  <div id="app"></div>
  <script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const CARD={
 copper:{name:'Miedź',cost:0,type:['treasure'],coins:1,text:'+1 moneta'},
 silver:{name:'Srebro',cost:3,type:['treasure'],coins:2,text:'+2 monety'},
 gold:{name:'Złoto',cost:6,type:['treasure'],coins:3,text:'+3 monety'},
 estate:{name:'Posiadłość',cost:2,type:['victory'],vp:1,text:'1 punkt zwycięstwa'},
 duchy:{name:'Księstwo',cost:5,type:['victory'],vp:3,text:'3 punkty zwycięstwa'},
 province:{name:'Prowincja',cost:8,type:['victory'],vp:6,text:'6 punktów zwycięstwa'},
 curse:{name:'Klątwa',cost:0,type:['curse'],vp:-1,text:'−1 punkt zwycięstwa'},
 village:{name:'Wioska',cost:3,type:['action'],cards:1,actions:2,text:'+1 karta · +2 akcje'},
 smithy:{name:'Kowal',cost:4,type:['action'],cards:3,text:'+3 karty'},
 market:{name:'Targ',cost:5,type:['action'],cards:1,actions:1,buys:1,coins:1,text:'+1 karta · +1 akcja · +1 zakup · +1 moneta'},
 militia:{name:'Milicja',cost:4,type:['action','attack'],coins:2,text:'+2 monety · inni odrzucają do 3 kart'},
 moat:{name:'Fosa',cost:2,type:['action','reaction'],cards:2,text:'+2 karty · blokuje ataki'},
 remodel:{name:'Przebudowa',cost:4,type:['action'],text:'Usuń kartę z ręki; zdobądź kartę kosztującą do +2 więcej',effect:'remodel'},
 workshop:{name:'Warsztat',cost:3,type:['action'],text:'Zdobądź kartę kosztującą do 4',effect:'workshop'},
 festival:{name:'Festiwal',cost:5,type:['action'],actions:2,buys:1,coins:2,text:'+2 akcje · +1 zakup · +2 monety'},
 laboratory:{name:'Laboratorium',cost:5,type:['action'],cards:2,actions:1,text:'+2 karty · +1 akcja'},
 mine:{name:'Kopalnia',cost:5,type:['action'],text:'Usuń skarb z ręki; zdobądź skarb kosztujący do +3 więcej do ręki',effect:'mine'}
};
const KINGDOM=['village','smithy','market','militia','moat','remodel','workshop','festival','laboratory','mine'];
const BASIC=['copper','silver','gold','estate','duchy','province','curse'];
const state={players:[],supply:{},trash:[],turn:0,round:1,phase:'action',actions:1,buys:1,coins:0,log:[],started:false,busy:false,pending:null};
let setupPlayers=3;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function log(msg){state.log.unshift(msg);state.log=state.log.slice(0,80)}
function current(){return state.players[state.turn]}
function initSupply(n){state.supply={};const victory=n===2?8:12;const curse=(n-1)*10;Object.assign(state.supply,{copper:60-n*7,silver:40,gold:30,estate:victory,duchy:victory,province:victory,curse});KINGDOM.forEach(id=>state.supply[id]=10)}
function makePlayer(name,bot){const deck=shuffle([...Array(7)].map(()=> 'copper'),...Array(3).fill('estate'));return{name,bot,deck,hand:[],discard:[],play:[],turns:0}}
function drawOne(p){if(!p.deck.length){if(!p.discard.length)return null;p.deck=shuffle(p.discard.splice(0))}const c=p.deck.pop();p.hand.push(c);return c}
function draw(p,n){for(let i=0;i<n;i++)drawOne(p)}
function score(p){return [...p.deck,...p.hand,...p.discard,...p.play].reduce((s,id)=>s+(CARD[id].vp||0),0)}
function startGame(n){setupPlayers=n;state.players=[makePlayer('Ty',false)];const names=['Anna','Jan','Marta'];for(let i=1;i<n;i++)state.players.push(makePlayer(names[i-1],true));initSupply(n);state.trash=[];state.turn=0;state.round=1;state.log=[];state.started=true;state.busy=false;state.pending=null;state.players.forEach(p=>draw(p,5));beginTurn();render()}
function beginTurn(){state.phase='action';state.actions=1;state.buys=1;state.coins=0;const p=current();p.turns++;log(`${p.name}: początek tury.`);if(p.bot)setTimeout(botTurn,450)}
function endGameReason(){if(state.supply.province<=0)return 'Stos Prowincji jest pusty.';if(Object.values(state.supply).filter(v=>v<=0).length>=3)return 'Trzy stosy kart są puste.';return null}
function cleanup(){const p=current();p.discard.push(...p.hand.splice(0),...p.play.splice(0));draw(p,5);const reason=endGameReason();if(reason){showResults(reason);return}state.turn=(state.turn+1)%state.players.length;if(state.turn===0)state.round++;beginTurn();render()}
function nextPhase(){if(state.busy||current().bot)return;if(state.phase==='action'){state.phase='buy';autoPlayTreasures(current());log('Przechodzisz do fazy zakupów.')}else if(state.phase==='buy'){state.phase='cleanup';render();setTimeout(cleanup,260);return}render()}
function autoPlayTreasures(p){const treasures=p.hand.filter(id=>CARD[id].type.includes('treasure'));for(const id of treasures){const idx=p.hand.indexOf(id);p.hand.splice(idx,1);p.play.push(id);state.coins+=CARD[id].coins||0}if(treasures.length)log(`${p.name} wykłada skarby za ${state.coins} monet.`)}
function playCard(index){const p=current();if(p.bot||state.busy||state.phase!=='action')return;const id=p.hand[index],c=CARD[id];if(!c.type.includes('action')||state.actions<1)return;state.actions--;p.hand.splice(index,1);p.play.push(id);resolveAction(p,id,()=>render())}
function resolveAction(p,id,done){const c=CARD[id];if(c.cards)draw(p,c.cards);state.actions+=c.actions||0;state.buys+=c.buys||0;state.coins+=c.coins||0;log(`${p.name} zagrywa „${c.name}”.`);if(id==='militia')attackMilitia(p);if(c.effect==='workshop'){if(p.bot){botGain(p,4);done();return}return chooseSupply(`Warsztat: wybierz kartę kosztującą do 4`,id=>CARD[id].cost<=4,chosen=>{gain(p,chosen,'discard');done()})}if(c.effect==='remodel'){if(p.bot){botRemodel(p);done();return}return chooseHand('Przebudowa: wybierz kartę do usunięcia',()=>true,(trashId)=>{if(!trashId){done();return}const idx=p.hand.indexOf(trashId);if(idx>=0){p.hand.splice(idx,1);state.trash.push(trashId);const max=CARD[trashId].cost+2;chooseSupply(`Zdobądź kartę kosztującą do ${max}`,id=>CARD[id].cost<=max,chosen=>{gain(p,chosen,'discard');done()})}})}if(c.effect==='mine'){if(p.bot){botMine(p);done();return}return chooseHand('Kopalnia: wybierz skarb do usunięcia',id=>CARD[id].type.includes('treasure'),trashId=>{if(!trashId){done();return}const idx=p.hand.indexOf(trashId);if(idx>=0){p.hand.splice(idx,1);state.trash.push(trashId);const max=CARD[trashId].cost+3;chooseSupply(`Zdobądź skarb kosztujący do ${max}`,id=>CARD[id].type.includes('treasure')&&CARD[id].cost<=max,chosen=>{gain(p,chosen,'hand');done()})}})}done()}
function hasMoat(p){return p.hand.includes('moat')}
function attackMilitia(attacker){for(const p of state.players){if(p===attacker)continue;if(hasMoat(p)){log(`${p.name} ujawnia Fosę i blokuje Milicję.`);continue}while(p.hand.length>3){const idx=p.hand.reduce((best,id,i,a)=>botCardValue(id)<botCardValue(a[best])?i:best,0);p.discard.push(p.hand.splice(idx,1)[0])}log(`${p.name} odrzuca karty do 3.`)}}
function gain(p,id,dest='discard'){if(!id||state.supply[id]<=0)return false;state.supply[id]--;p[dest].push(id);log(`${p.name} zdobywa „${CARD[id].name}”.`);return true}
function buy(id){const p=current(),c=CARD[id];if(p.bot||state.busy||state.phase!=='buy'||state.buys<1||state.coins<c.cost||state.supply[id]<=0)return;state.coins-=c.cost;state.buys--;gain(p,id);render()}
function botCardValue(id){const c=CARD[id];if(id==='curse')return-10;if(c.type.includes('victory'))return c.vp||0;if(c.type.includes('treasure'))return c.coins*3+c.cost;if(c.type.includes('action'))return c.cost+2;return c.cost}
function botGain(p,max){const ids=Object.keys(state.supply).filter(id=>state.supply[id]>0&&CARD[id].cost<=max);ids.sort((a,b)=>botCardValue(b)-botCardValue(a));if(ids[0])gain(p,ids[0])}
function botRemodel(p){if(!p.hand.length)return;const idx=p.hand.reduce((best,id,i,a)=>botCardValue(id)<botCardValue(a[best])?i:best,0);const old=p.hand.splice(idx,1)[0];state.trash.push(old);botGain(p,CARD[old].cost+2)}
function botMine(p){const ids=p.hand.map((id,i)=>({id,i})).filter(x=>CARD[x.id].type.includes('treasure')).sort((a,b)=>CARD[a.id].cost-CARD[b.id].cost);if(!ids.length)return;const x=ids[0];p.hand.splice(x.i,1);state.trash.push(x.id);const choices=Object.keys(state.supply).filter(id=>state.supply[id]>0&&CARD[id].type.includes('treasure')&&CARD[id].cost<=CARD[x.id].cost+3).sort((a,b)=>CARD[b].cost-CARD[a].cost);if(choices[0])gain(p,choices[0],'hand')}
function botTurn(){const p=current();if(!p.bot||!state.started)return;state.busy=true;render();let safety=20;while(state.phase==='action'&&state.actions>0&&safety--){const options=p.hand.map((id,i)=>({id,i})).filter(x=>CARD[x.id].type.includes('action')).sort((a,b)=>CARD[b.id].cost-CARD[a.id].cost);if(!options.length)break;const x=options[0];state.actions--;p.hand.splice(x.i,1);p.play.push(x.id);resolveAction(p,x.id,()=>{});if(state.pending)break}state.phase='buy';autoPlayTreasures(p);let buys=state.buys;while(buys-->0){const target=botBuyChoice(state.coins);if(!target)break;state.coins-=CARD[target].cost;gain(p,target);state.buys--}state.busy=false;render();setTimeout(cleanup,650)}
function botBuyChoice(coins){const provinceLeft=state.supply.province;const ids=Object.keys(state.supply).filter(id=>state.supply[id]>0&&CARD[id].cost<=coins&&id!=='curse');const rank=id=>{if(id==='province')return 100;if(id==='duchy'&&provinceLeft<=4)return 80;if(id==='estate'&&provinceLeft<=2)return 65;if(id==='gold')return 60;if(id==='laboratory'||id==='market')return 55;if(id==='festival'||id==='mine')return 50;if(id==='silver')return 35;if(CARD[id].type.includes('action'))return 25+CARD[id].cost;return CARD[id].cost};ids.sort((a,b)=>rank(b)-rank(a));return ids[0]||null}
function chooseSupply(title,filter,cb){state.busy=true;state.pending={type:'supply'};const options=Object.keys(state.supply).filter(id=>state.supply[id]>0&&filter(id));showChoice(title,options,cb)}
function chooseHand(title,filter,cb){state.busy=true;state.pending={type:'hand'};const p=current();const options=p.hand.filter(filter);if(!options.length){state.busy=false;state.pending=null;cb(null);return}showChoice(title,options,cb)}
function showChoice(title,ids,cb){const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<div class="modal"><span class="eyebrow">Wybór karty</span><h2>${esc(title)}</h2><div class="target-grid">${ids.map(id=>`<button class="target-card" data-id="${id}"><b>${esc(CARD[id].name)}</b><br><small>${CARD[id].cost} monet · ${esc(CARD[id].text||'')}</small></button>`).join('')}</div></div>`;document.body.appendChild(overlay);overlay.querySelectorAll('button').forEach(b=>b.onclick=()=>{const id=b.dataset.id;overlay.remove();state.busy=false;state.pending=null;cb(id);render()})}
function showResults(reason){state.started=false;const ranked=[...state.players].map(p=>({name:p.name,score:score(p),turns:p.turns})).sort((a,b)=>b.score-a.score||a.turns-b.turns);const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<div class="modal"><span class="eyebrow">Koniec gry</span><h2>Królestwo podliczone</h2><p>${esc(reason)}</p><div class="result-list">${ranked.map((r,i)=>`<div class="result-row ${i===0?'winner':''}"><span>${i+1}. ${esc(r.name)}</span><b>${r.score} PZ</b></div>`).join('')}</div><button class="btn primary" id="again">Nowa gra</button></div>`;document.body.appendChild(overlay);$('#again').onclick=()=>{overlay.remove();showSetup()}}
function cardHtml(id,opts={}){const c=CARD[id],cl=['card',...c.type,opts.playable?'playable':'',opts.buyable?'buyable':''].join(' ');return `<div class="${cl}" ${opts.action||''}><span class="type">${esc(c.type.join(' · '))}</span><h4>${esc(c.name)}</h4><div class="rules">${esc(c.text||'')}</div><span class="cost">${c.cost}</span></div>`}
function pileHtml(id){const c=CARD[id],buyable=!current().bot&&state.phase==='buy'&&state.buys>0&&state.coins>=c.cost&&state.supply[id]>0;return `<div class="pile" data-buy="${id}"><span class="count">${state.supply[id]}</span>${cardHtml(id,{buyable})}</div>`}
function render(){if(!state.started)return;const p=current();const human=!p.bot;const phaseName={action:'Faza akcji',buy:'Faza zakupów',cleanup:'Porządki'}[state.phase];const hand=current().hand.map((id,i)=>cardHtml(id,{playable:human&&state.phase==='action'&&CARD[id].type.includes('action')&&state.actions>0,action:`data-play="${i}" style="--rot:${(i-(p.hand.length-1)/2)*2.4}deg;--drop:${Math.abs(i-(p.hand.length-1)/2)*2}px"`})).join('');document.querySelector('#app').innerHTML=`<div class="app"><header class="topbar"><div class="brand"><small>Deck-building · 2–4 graczy</small><h1>OPEN DOMINION</h1></div><div class="stats"><div class="stat"><span class="eyebrow">Runda</span><b>${state.round}</b></div><div class="stat ${state.phase==='action'?'active':''}"><span class="eyebrow">Akcje</span><b>${state.actions}</b></div><div class="stat ${state.phase==='buy'?'active':''}"><span class="eyebrow">Zakupy</span><b>${state.buys}</b></div><div class="stat ${state.phase==='buy'?'active':''}"><span class="eyebrow">Monety</span><b>${state.coins}</b></div></div><div class="top-actions"><button class="btn ghost" id="newGame">Nowa gra</button></div></header><main class="main"><aside class="sidebar"><span class="eyebrow">${human?'Twoja tura':'Tura bota'}</span><h2>${esc(phaseName)}</h2><p>${state.busy?'Rozpatrywanie efektu…':state.phase==='action'?'Zagraj kartę Akcji albo przejdź dalej.':state.phase==='buy'?'Kup kartę ze stołu.':'Odrzucanie i dobieranie nowej ręki.'}</p><div class="phase-actions"><button class="btn primary" id="nextPhase" ${!human||state.busy||state.phase==='cleanup'?'disabled':''}>${state.phase==='action'?'Zakończ akcje':state.phase==='buy'?'Zakończ zakupy':'Czekaj…'}</button></div><div class="log"><span class="eyebrow">Dziennik</span><div class="log-items">${state.log.map(x=>`<div class="log-item">${esc(x)}</div>`).join('')}</div></div></aside><section class="board-shell"><div class="board"><div class="market"><h3>Rynek Królestwa</h3><div class="piles">${KINGDOM.map(pileHtml).join('')}</div><div class="piles basic-piles">${BASIC.map(pileHtml).join('')}</div><div class="play-area"><div class="play-title">W grze</div><div class="played">${p.play.map(id=>cardHtml(id)).join('')}</div></div><div class="hand-zone"><div class="hand-title">${human?'Twoja ręka':`Ręka: ${p.hand.length} kart`}</div><div class="hand">${human?hand:''}</div></div></div><aside class="players">${state.players.map((pl,i)=>`<div class="player-seat ${i===state.turn?'active':''}"><h4>${esc(pl.name)}</h4><div class="seat-meta">${pl.bot?'BOT':'GRACZ'} · talia ${pl.deck.length} · odrzucone ${pl.discard.length}</div><div class="seat-score">${score(pl)} PZ</div></div>`).join('')}<div class="supply-note">Gra kończy się po wyczerpaniu Prowincji albo dowolnych trzech stosów. Remisy rozstrzyga mniejsza liczba tur.</div></aside></div></section></main></div>`;document.querySelectorAll('[data-play]').forEach(el=>el.onclick=()=>playCard(+el.dataset.play));document.querySelectorAll('[data-buy]').forEach(el=>el.onclick=()=>buy(el.dataset.buy));$('#nextPhase').onclick=nextPhase;$('#newGame').onclick=showSetup}
function showSetup(){const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<div class="modal"><span class="eyebrow">Nowa gra</span><h2>Zbuduj swoje królestwo</h2><p>Wybierz liczbę graczy. Pozostałe miejsca zajmą boty. Multiplayer zostaje na późniejszy etap.</p><div class="setup-grid">${[2,3,4].map(n=>`<button class="choice ${n===setupPlayers?'selected':''}" data-n="${n}"><b>${n} graczy</b><br><small>Ty + ${n-1} ${n===2?'bot':'boty'}</small></button>`).join('')}</div><button class="btn primary" id="start">Rozpocznij</button></div>`;document.body.appendChild(overlay);overlay.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{setupPlayers=+b.dataset.n;overlay.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===b))});overlay.querySelector('#start').onclick=()=>{overlay.remove();startGame(setupPlayers)}}
showSetup();
})();
  </script>
</body>
