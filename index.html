.tutorial-panel{position:fixed;right:24px;top:98px;z-index:42;width:min(360px,calc(100vw - 48px));border:1px solid rgba(215,180,94,.55);border-radius:18px;background:linear-gradient(155deg,#19271f,#0b1510);box-shadow:0 24px 70px rgba(0,0,0,.48);padding:16px;animation:tutorialIn .3s ease}.tutorial-panel .step{color:var(--gold2);font-size:9px;text-transform:uppercase;letter-spacing:.16em;font-weight:900}.tutorial-panel h3{font-family:Georgia,serif;margin:5px 0 7px;font-size:21px}.tutorial-panel p{color:#c1cec5;font-size:12px;line-height:1.5;margin:0}.tutorial-panel .tutorial-actions{display:flex;justify-content:space-between;gap:8px;margin-top:12px}.tutorial-badge{display:inline-block;margin-top:10px;padding:5px 8px;border-radius:999px;border:1px solid rgba(215,180,94,.3);color:var(--gold2);font-size:10px}.tutorial-focus{position:relative;z-index:4;outline:3px solid var(--gold)!important;box-shadow:0 0 0 6px rgba(215,180,94,.14),0 0 35px rgba(215,180,94,.4)!important;animation:tutorialPulse 1.2s ease-in-out infinite!important}.tutorial-blocked{filter:saturate(.45) brightness(.65);pointer-events:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(9px);display:grid;place-items:center;padding:20px;z-index:70}.modal{width:min(720px,96vw);max-height:90vh;overflow:auto;background:linear-gradient(#17231d,#0d1511);border:1px solid rgba(215,180,94,.36);border-radius:22px;padding:24px;box-shadow:var(--shadow);animation:modalIn .25s ease}.modal h2{font-family:Georgia,serif;font-size:30px;margin:4px 0 10px}.modal p{color:var(--muted);line-height:1.5}.setup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.choice{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);text-align:left}.choice.selected{border-color:var(--gold);box-shadow:0 0 0 1px rgba(215,180,94,.25)}.setup-actions{display:flex;gap:10px;flex-wrap:wrap}.target-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.target-card{border:1px solid var(--line);background:#142019;border-radius:12px;padding:12px;color:var(--ink);text-align:left}.target-card:hover{border-color:var(--gold)}.result-list{display:grid;gap:8px;margin:18px 0}.result-row{display:flex;justify-content:space-between;padding:10px 12px;background:rgba(255,255,255,.04);border-radius:10px}.result-row.winner{outline:1px solid var(--gold)}
.fx-card{position:fixed;z-index:95;pointer-events:none;width:96px;transform-origin:center center;transition:transform .55s cubic-bezier(.18,.82,.24,1),opacity .55s ease;box-shadow:0 18px 34px rgba(0,0,0,.34)}.toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:#0d1511;border:1px solid var(--gold);padding:10px 14px;border-radius:999px;z-index:98;box-shadow:0 12px 30px rgba(0,0,0,.4);font-size:12px;animation:toastIn .25s ease}

/* Card art direction v3: unified labels, rich image treatment and cursor-reactive shine */
.card{--shine-x:50%;--shine-y:45%;--art-x:0px;--art-y:0px;isolation:isolate;overflow:hidden;will-change:transform,box-shadow}
.card .type{display:inline-flex;align-items:center;min-height:18px;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.64);border:1px solid rgba(40,45,42,.15);box-shadow:0 1px 0 rgba(255,255,255,.75) inset;color:#4f5b55;font-family:Inter,system-ui,sans-serif;font-size:7px;line-height:1;font-weight:900;letter-spacing:.135em;white-space:nowrap}
.card h4{position:relative;margin:5px 34px 5px 0;padding:0 0 5px;font-family:Georgia,'Times New Roman',serif;font-size:16px;line-height:1.02;font-weight:700;letter-spacing:.015em;color:#20241f;text-shadow:0 1px rgba(255,255,255,.78)}
.card h4:after{content:'';position:absolute;left:0;bottom:0;width:34px;height:1px;background:linear-gradient(90deg,rgba(126,93,39,.85),transparent)}
.card .rules{position:relative;margin-top:7px;padding-top:6px;border-top:1px solid rgba(50,58,53,.11);font-family:Inter,system-ui,sans-serif;font-size:9.5px;line-height:1.32;font-weight:560;color:#343d38}
.card .cost{z-index:5;border:1px solid rgba(101,70,19,.45);box-shadow:inset 0 1px rgba(255,255,255,.62),0 2px 5px rgba(43,30,10,.26);font-size:15px}
.art{position:relative;height:88px;border-radius:9px;overflow:hidden;margin:5px 0 5px;border:1px solid rgba(45,38,28,.18);background:#d9d7cb;box-shadow:inset 0 1px rgba(255,255,255,.5),0 2px 8px rgba(35,31,24,.14)}
.art svg,.art img{width:100%;height:100%;display:block}
.art img{object-fit:cover;transform:scale(1.045) translate(var(--art-x),var(--art-y));transition:transform .28s cubic-bezier(.2,.75,.2,1),filter .25s ease;filter:saturate(1.07) contrast(1.035) brightness(.995)}
.art:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.13),transparent 25%,transparent 72%,rgba(13,14,12,.13)),radial-gradient(circle at 50% 120%,rgba(237,209,135,.12),transparent 55%)}
.card:after{content:'';position:absolute;z-index:9;inset:-45%;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--shine-x) var(--shine-y),rgba(255,255,255,.34) 0,rgba(255,244,207,.13) 18%,rgba(255,255,255,0) 46%);mix-blend-mode:soft-light;transition:opacity .22s ease}
.card.fx-hover:after{opacity:.72}
.card.fx-hover .art img{filter:saturate(1.12) contrast(1.045) brightness(1.025)}
.card.treasure .type{background:rgba(246,226,176,.78);border-color:rgba(137,94,32,.24);color:#6e4b1e}
.card.victory .type{background:rgba(218,235,212,.82);border-color:rgba(66,118,76,.23);color:#356340}
.card.attack .type{background:rgba(241,211,202,.82);border-color:rgba(150,67,58,.26);color:#7f3833}
.card.reaction .type{background:rgba(213,230,246,.84);border-color:rgba(65,104,148,.23);color:#365f88}
.card.curse .type{background:rgba(229,210,232,.83);border-color:rgba(111,68,118,.25);color:#653d6b}
@media (hover:hover) and (pointer:fine){.card.fx-hover{box-shadow:0 16px 35px rgba(0,0,0,.33),0 0 0 1px rgba(244,220,150,.15) inset}.pile .card.fx-hover{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.card:after{display:none}.art img{transform:none!important;transition:none!important}}
@keyframes handDeal{from{opacity:0;transform:translateY(28px) rotate(var(--rot,0deg)) scale(.9)}to{opacity:1;transform:rotate(var(--rot,0deg)) translateY(var(--drop,0)) scale(1)}}@keyframes cardLand{0%{opacity:.2;transform:translateY(36px) rotate(6deg) scale(.76)}70%{transform:translateY(-4px) rotate(-1deg) scale(.94)}100%{opacity:1;transform:scale(.9)}}@keyframes purchaseFlash{0%,100%{filter:none}40%{filter:brightness(1.22);box-shadow:0 0 0 5px rgba(215,180,94,.18),0 0 35px rgba(215,180,94,.42)}}@keyframes countPop{50%{transform:scale(1.3);background:var(--gold);color:#15140e}}@keyframes seatGlow{50%{box-shadow:0 0 0 1px rgba(215,180,94,.38),0 0 38px rgba(215,180,94,.2)}}@keyframes resourcePulse{50%{transform:scale(1.08);border-color:var(--gold);box-shadow:0 0 24px rgba(215,180,94,.28)}}@keyframes phaseIn{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}@keyframes tutorialIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}@keyframes tutorialPulse{50%{box-shadow:0 0 0 6px rgba(215,180,94,.2),0 0 45px rgba(215,180,94,.45)!important}}

<script>
(()=>{
'use strict';

const state={players:[],supply:{},trash:[],turn:0,round:1,phase:'action',actions:1,buys:1,coins:0,log:[],started:false,busy:false,pending:null,lastBought:null,coinPulse:0,tutorial:null};
let setupPlayers=3;
const current=()=>state.players[state.turn], phaseTitle=()=>({action:'Faza akcji',buy:'Faza zakupów',cleanup:'Porządki'})[state.phase];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a} function log(m){state.log.unshift(m);state.log=state.log.slice(0,90)}
function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const el=document.createElement('div');el.className='toast';el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}
function initSupply(n){state.supply={};const v=n===2?8:12;Object.assign(state.supply,{copper:60-n*7,silver:40,gold:30,estate:v,duchy:v,province:v,curse:(n-1)*10});KINGDOM.forEach(id=>state.supply[id]=10)}
function makePlayer(name,bot){const deck=shuffle([...Array(7)].fill('copper').concat([...Array(3)].fill('estate')));return{name,bot,deck,hand:[],discard:[],play:[],turns:0}}
function drawOne(p){if(!p.deck.length){if(!p.discard.length)return null;p.deck=shuffle(p.discard.splice(0));log(p.name+' przetasowuje stos odrzuconych.')}const c=p.deck.pop();p.hand.push(c);return c} function draw(p,n){for(let i=0;i<n;i++)drawOne(p)} function score(p){return [...p.deck,...p.hand,...p.discard,...p.play].reduce((s,id)=>s+(CARD[id].vp||0),0)}
function canInteract(){return state.started&&!state.busy&&!current().bot} function pulseCoins(){state.coinPulse=Date.now()+650}
function tutorialStep(){return state.tutorial&&state.tutorial.active?state.tutorial.steps[state.tutorial.index]:null}
function gateTutorial(kind,payload){const t=tutorialStep();if(!t||!t.guard)return true;const g=t.guard;const ok=(kind===g.kind)&&(!g.card||g.card===payload);if(ok)return true;toast(t.blocked||'Wykonaj wskazany krok samouczka.');return false}
function advanceTutorial(){if(!(state.tutorial&&state.tutorial.active))return;state.tutorial.index++;if(state.tutorial.index>=state.tutorial.steps.length){state.tutorial.active=false;state.tutorial.finished=true;toast('Samouczek zakończony.')}render()}
function beginTurn(skipBot){state.phase='action';state.actions=1;state.buys=1;state.coins=0;const p=current();p.turns++;log(p.name+': początek tury.');if(p.bot&&!skipBot)setTimeout(botTurn,450)}
function endGameReason(){if(state.supply.province<=0)return 'Stos Prowincji jest pusty.';if(Object.values(state.supply).filter(v=>v<=0).length>=3)return 'Trzy stosy kart są puste.';return null}
function cleanup(){const p=current();p.discard.push(...p.hand.splice(0),...p.play.splice(0));draw(p,5);const reason=endGameReason();if(reason){showResults(reason);return}state.turn=(state.turn+1)%state.players.length;if(state.turn===0)state.round++;beginTurn(false);if(state.tutorial&&state.tutorial.active&&state.tutorial.index===4)advanceTutorial();render()}
function startGame(n){setupPlayers=n;state.players=[makePlayer('Ty',false)];const names=['Anna','Jan','Marta'];for(let i=1;i<n;i++)state.players.push(makePlayer(names[i-1],true));initSupply(n);state.trash=[];state.turn=0;state.round=1;state.log=[];state.started=true;state.busy=false;state.pending=null;state.lastBought=null;state.tutorial=null;state.players.forEach(p=>draw(p,5));beginTurn(false);render()}
function startTutorial(){state.tutorial={active:true,finished:false,index:0,steps:[{title:'Zagraj Wioskę',text:'Kliknij Wioskę na ręce. Karty Akcji zagrywa się w fazie akcji.',focus:"[data-cardid='village'][data-zone='hand']",guard:{kind:'play-action',card:'village'},blocked:'Najpierw kliknij Wioskę.'},{title:'Przejdź do zakupów',text:'Masz dodatkowe akcje i dobraną kartę. Teraz przejdź do fazy zakupów.',focus:'#nextPhase',guard:{kind:'goto-buy'},blocked:'Kliknij „Przejdź do zakupów”.'},{title:'Zagraj skarby',text:'Monety na dole aktualizują się na bieżąco. Zagraj wszystkie skarby jednym przyciskiem.',focus:'#playAllTreasures',guard:{kind:'play-all'},blocked:'Kliknij „Zagraj wszystkie”.'},{title:'Kup Srebro',text:'Kup Srebro, aby wzmocnić swoją talię.',focus:"[data-buy='silver']",guard:{kind:'buy',card:'silver'},blocked:'Kup teraz Srebro.'},{title:'Zakończ turę',text:'Zakup trafi na stos odrzuconych. Zakończ turę, aby dobrać nową rękę.',focus:'#nextPhase',guard:{kind:'end-turn'},blocked:'Kliknij „Zakończ turę”.'},{title:'Gotowe',text:'To był pełny przebieg tury: Akcje → Skarby → Zakup → Porządki.',focus:'.turn-dock',guard:null}]};state.players=[makePlayer('Ty',false),makePlayer('Anna',true)];initSupply(2);state.turn=0;state.round=1;state.phase='action';state.actions=1;state.buys=1;state.coins=0;state.log=[];state.started=true;state.busy=false;state.pending=null;state.lastBought=null;const me=state.players[0],bot=state.players[1];me.hand=['village','copper','copper','copper','estate'];me.deck=['silver','estate','copper','estate','copper'];me.discard=[];me.play=[];bot.hand=['copper','estate','copper','estate','copper'];bot.deck=['copper','copper','copper','estate','copper'];bot.discard=[];bot.play=[];beginTurn(true);render()}
function nextPhase(){if(!canInteract())return;if(state.tutorial&&state.tutorial.active&&!gateTutorial(state.phase==='action'?'goto-buy':'end-turn'))return;if(state.phase==='action'){state.phase='buy';log('Przechodzisz do fazy zakupów.');render();if(state.tutorial&&state.tutorial.active&&state.tutorial.index===1)advanceTutorial()}else{state.phase='cleanup';render();setTimeout(cleanup,240)}}
function fly(id,start,targetSel){if(reduced()||!start)return;requestAnimationFrame(()=>{const target=document.querySelector(targetSel);if(!target)return;const end=target.getBoundingClientRect();const ghost=document.createElement('div');ghost.className='fx-card';ghost.style.left=start.left+'px';ghost.style.top=start.top+'px';ghost.style.width=start.width+'px';ghost.style.height=start.height+'px';ghost.innerHTML=cardHtml(id,{compact:true});document.body.appendChild(ghost);requestAnimationFrame(()=>{ghost.style.transform='translate('+(end.left-start.left)+'px,'+(end.top-start.top)+'px) scale('+(end.width/start.width||.7)+','+(end.height/start.height||.7)+') rotate('+(Math.random()*10-5)+'deg)';ghost.style.opacity='0.18'});setTimeout(()=>ghost.remove(),620)})}
function playCard(i,el){const p=current(),id=p.hand[i],c=CARD[id];if(!canInteract()||state.phase!=='action'||!c||!c.type.includes('action')||state.actions<1)return;if(state.tutorial&&state.tutorial.active&&!gateTutorial('play-action',id))return;const rect=el&&el.getBoundingClientRect();state.actions--;p.hand.splice(i,1);p.play.push(id);if(c.cards)draw(p,c.cards);state.actions+=c.actions||0;state.buys+=c.buys||0;state.coins+=c.coins||0;if(c.coins)pulseCoins();log(p.name+' zagrywa „'+c.name+'”.');if(id==='militia')attackMilitia(p);const finish=()=>{render();fly(id,rect,'.played-dropzone');if(state.tutorial&&state.tutorial.active&&state.tutorial.index===0)advanceTutorial()};if(c.effect==='workshop'){if(p.bot){botGain(p,4);finish();return}return chooseSupply('Warsztat: wybierz kartę kosztującą do 4',x=>CARD[x].cost<=4,ch=>{gain(p,ch,'discard');finish()})}if(c.effect==='remodel'){if(p.bot){botRemodel(p);finish();return}return chooseHand('Przebudowa: wybierz kartę do usunięcia',()=>true,trashId=>{if(!trashId){finish();return}const idx=p.hand.indexOf(trashId);if(idx>=0){p.hand.splice(idx,1);state.trash.push(trashId);const max=CARD[trashId].cost+2;chooseSupply('Zdobądź kartę kosztującą do '+max,x=>CARD[x].cost<=max,ch=>{gain(p,ch,'discard');finish()})}})}if(c.effect==='mine'){if(p.bot){botMine(p);finish();return}return chooseHand('Kopalnia: wybierz skarb do usunięcia',x=>CARD[x].type.includes('treasure'),trashId=>{if(!trashId){finish();return}const idx=p.hand.indexOf(trashId);if(idx>=0){p.hand.splice(idx,1);state.trash.push(trashId);const max=CARD[trashId].cost+3;chooseSupply('Zdobądź skarb kosztujący do '+max,x=>CARD[x].type.includes('treasure')&&CARD[x].cost<=max,ch=>{gain(p,ch,'hand');finish()})}})}finish()}
function playTreasure(i,el){const p=current(),id=p.hand[i],c=CARD[id];if(!canInteract()||state.phase!=='buy'||!c||!c.type.includes('treasure'))return;if(state.tutorial&&state.tutorial.active&&!gateTutorial('play-all'))return;const rect=el&&el.getBoundingClientRect();p.hand.splice(i,1);p.play.push(id);state.coins+=c.coins||0;pulseCoins();log(p.name+' zagrywa '+c.name+'.');render();fly(id,rect,'.played-dropzone')}
function playAllTreasures(){if(!canInteract()||state.phase!=='buy')return;if(state.tutorial&&state.tutorial.active&&!gateTutorial('play-all'))return;const p=current();let cnt=0,sum=0;for(let i=p.hand.length-1;i>=0;i--){const id=p.hand[i];if(CARD[id].type.includes('treasure')){cnt++;sum+=CARD[id].coins||0;p.play.push(id);p.hand.splice(i,1)}}if(!cnt){toast('Nie masz skarbów na ręce.');return}state.coins+=sum;pulseCoins();log(p.name+' wykłada skarby za '+sum+' monet.');render();if(state.tutorial&&state.tutorial.active&&state.tutorial.index===2)advanceTutorial()}
function hasMoat(p){return p.hand.includes('moat')} function attackMilitia(a){for(const p of state.players){if(p===a)continue;if(hasMoat(p)){log(p.name+' ujawnia Fosę i blokuje Milicję.');continue}while(p.hand.length>3){const idx=p.hand.reduce((b,id,i,arr)=>botCardValue(id)<botCardValue(arr[b])?i:b,0);p.discard.push(p.hand.splice(idx,1)[0])}log(p.name+' odrzuca karty do 3.')}}
function gain(p,id,d='discard'){if(!id||state.supply[id]<=0)return false;state.supply[id]--;p[d].push(id);state.lastBought=id;log(p.name+' zdobywa „'+CARD[id].name+'”.');render();return true}
function buy(id,el){const p=current(),c=CARD[id];if(!canInteract()||state.phase!=='buy'||state.buys<1||state.coins<c.cost||state.supply[id]<=0)return;if(state.tutorial&&state.tutorial.active&&!gateTutorial('buy',id))return;const rect=(el.closest('.pile')||el).getBoundingClientRect();state.coins-=c.cost;state.buys--;pulseCoins();gain(p,id);fly(id,rect,'[data-seat="'+state.turn+'"] .seat-discard');if(state.tutorial&&state.tutorial.active&&state.tutorial.index===3)advanceTutorial()}
function botCardValue(id){const c=CARD[id];if(id==='curse')return-10;if(c.type.includes('victory'))return c.vp||0;if(c.type.includes('treasure'))return c.coins*3+c.cost;if(c.type.includes('action'))return c.cost+2;return c.cost} function botGain(p,max){const ids=Object.keys(state.supply).filter(id=>state.supply[id]>0&&CARD[id].cost<=max).sort((a,b)=>botCardValue(b)-botCardValue(a));if(ids[0])gain(p,ids[0])} function botRemodel(p){if(!p.hand.length)return;const idx=p.hand.reduce((b,id,i,arr)=>botCardValue(id)<botCardValue(arr[b])?i:b,0),old=p.hand.splice(idx,1)[0];state.trash.push(old);botGain(p,CARD[old].cost+2)} function botMine(p){const ids=p.hand.map((id,i)=>({id,i})).filter(x=>CARD[x.id].type.includes('treasure')).sort((a,b)=>CARD[a.id].cost-CARD[b.id].cost);if(!ids.length)return;const x=ids[0];p.hand.splice(x.i,1);state.trash.push(x.id);const ch=Object.keys(state.supply).filter(id=>state.supply[id]>0&&CARD[id].type.includes('treasure')&&CARD[id].cost<=CARD[x.id].cost+3).sort((a,b)=>CARD[b].cost-CARD[a].cost);if(ch[0])gain(p,ch[0],'hand')}
function botBuyChoice(coins){const pl=state.supply.province;const ids=Object.keys(state.supply).filter(id=>state.supply[id]>0&&CARD[id].cost<=coins&&id!=='curse');const rank=id=>id==='province'?100:id==='duchy'&&pl<=4?80:id==='estate'&&pl<=2?65:id==='gold'?60:(id==='laboratory'||id==='market')?55:(id==='festival'||id==='mine')?50:id==='silver'?35:CARD[id].type.includes('action')?25+CARD[id].cost:CARD[id].cost;ids.sort((a,b)=>rank(b)-rank(a));return ids[0]||null}
function botTurn(){const p=current();if(!p.bot||!state.started)return;state.busy=true;render();let safety=20;while(state.phase==='action'&&state.actions>0&&safety--){const opts=p.hand.map((id,i)=>({id,i})).filter(x=>CARD[x.id].type.includes('action')).sort((a,b)=>CARD[b.id].cost-CARD[a.id].cost);if(!opts.length)break;const x=opts[0];state.actions--;p.hand.splice(x.i,1);p.play.push(x.id);if(CARD[x.id].cards)draw(p,CARD[x.id].cards);state.actions+=CARD[x.id].actions||0;state.buys+=CARD[x.id].buys||0;state.coins+=CARD[x.id].coins||0;if(x.id==='militia')attackMilitia(p);if(CARD[x.id].effect==='workshop')botGain(p,4);if(CARD[x.id].effect==='remodel')botRemodel(p);if(CARD[x.id].effect==='mine')botMine(p);log(p.name+' zagrywa „'+CARD[x.id].name+'”.')}state.phase='buy';for(let i=p.hand.length-1;i>=0;i--){const id=p.hand[i];if(CARD[id].type.includes('treasure')){state.coins+=CARD[id].coins||0;p.play.push(id);p.hand.splice(i,1)}}let buys=state.buys;while(buys-->0){const t=botBuyChoice(state.coins);if(!t)break;state.coins-=CARD[t].cost;gain(p,t);state.buys--}state.busy=false;render();setTimeout(cleanup,650)}
function chooseSupply(title,filter,cb){state.busy=true;state.pending={type:'supply'};showChoice(title,Object.keys(state.supply).filter(id=>state.supply[id]>0&&filter(id)),cb)} function chooseHand(title,filter,cb){state.busy=true;state.pending={type:'hand'};const opts=current().hand.filter(filter);if(!opts.length){state.busy=false;state.pending=null;cb(null);return}showChoice(title,opts,cb)} function showChoice(title,ids,cb){const ov=document.createElement('div');ov.className='overlay';ov.innerHTML='<div class="modal"><span class="eyebrow">Wybór karty</span><h2>'+esc(title)+'</h2><div class="target-grid">'+ids.map(id=>'<button class="target-card" data-id="'+id+'"><b>'+esc(CARD[id].name)+'</b><br><small>'+CARD[id].cost+' monet · '+esc(CARD[id].text||'')+'</small></button>').join('')+'</div></div>';document.body.appendChild(ov);ov.querySelectorAll('button').forEach(b=>b.onclick=()=>{ov.remove();state.busy=false;state.pending=null;cb(b.dataset.id);render()})}
function showResults(reason){state.started=false;const ranked=[...state.players].map(p=>({name:p.name,score:score(p),turns:p.turns})).sort((a,b)=>b.score-a.score||a.turns-b.turns);const ov=document.createElement('div');ov.className='overlay';ov.innerHTML='<div class="modal"><span class="eyebrow">Koniec gry</span><h2>Królestwo podliczone</h2><p>'+esc(reason)+'</p><div class="result-list">'+ranked.map((r,i)=>'<div class="result-row '+(i===0?'winner':'')+'"><span>'+(i+1)+'. '+esc(r.name)+'</span><b>'+r.score+' PZ</b></div>').join('')+'</div><button class="btn primary" id="again">Nowa gra</button></div>';document.body.appendChild(ov);$('#again').onclick=()=>{ov.remove();showSetup()}}
function artSvg(id){
  const src=CARD_ART_IMAGES[id];
  if(src)return `<div class='art art-img'><img src='${src}' alt='' loading='eager' decoding='async'></div>`;
  const tint=(id==='gold'?'#c79b31':id==='silver'?'#9ca7b5':id==='copper'?'#aa6640':'#6d8575');
  return `<div class='art'><svg viewBox='0 0 120 70' aria-hidden='true'><rect width='120' height='70' fill='#dfe8ef'/><rect y='52' width='120' height='18' fill='#6d8d63'/><rect x='18' y='20' width='84' height='26' fill='#d2c0a0'/><polygon points='14,22 60,7 106,22' fill='${tint}'/><rect x='53' y='28' width='14' height='18' fill='#415058'/><circle cx='28' cy='58' r='3' fill='#7c9b6c'/><circle cx='92' cy='58' r='3' fill='#7c9b6c'/></svg></div>`;
}
function cardHtml(id,o={}){const c=CARD[id], cl=['card',...c.type,o.playable?'playable':'',o.buyable?'buyable':''].join(' ');return `<div class='${cl}' ${o.action||''} data-cardid='${id}' data-zone='${o.zone||''}'><span class='type'>${esc(c.type.join(' · '))}</span><h4>${esc(c.name)}</h4>${artSvg(id)}<div class='rules'>${esc(c.text||'')}</div><span class='cost'>${c.cost}</span></div>`} function pileHtml(id){const c=CARD[id],buyPhase=!current().bot&&state.phase==='buy',b=buyPhase&&state.buys>0&&state.coins>=c.cost&&state.supply[id]>0,afford=buyPhase&&state.supply[id]>0?(b?'affordable':'unaffordable'):'',sold=state.supply[id]<=0?'soldout':'';return `<div class='pile ${afford} ${sold} ${state.lastBought===id?'just-bought':''}' data-buy='${id}'><span class='count'>${state.supply[id]}</span>${cardHtml(id,{buyable:b,zone:'supply'})}</div>`}
function renderTutorialPanel(){const t=tutorialStep();if(!t)return '';return `<div class='tutorial-panel'><div class='step'>Samouczek · krok ${state.tutorial.index+1}/${state.tutorial.steps.length}</div><h3>${esc(t.title)}</h3><p>${esc(t.text)}</p><span class='tutorial-badge'>Sterowana rozgrywka</span><div class='tutorial-actions'>${state.tutorial.index===state.tutorial.steps.length-1?`<button class='btn primary' id='tutorialClose'>Zamknij</button>`:`<button class='btn ghost' id='tutorialSkip'>Pomiń samouczek</button><button class='btn ghost' id='tutorialRepeat'>Powtórz opis</button>`}</div></div>`}
function applyTutorialFocus(){if(!(state.tutorial&&state.tutorial.active))return;const step=tutorialStep(), focus=step&&document.querySelector(step.focus);if(focus)focus.classList.add('tutorial-focus');document.querySelectorAll('#app button,#app .card,#app .pile,#app .player-seat,#app .turn-dock').forEach(el=>{if(!focus)return;if(el===focus||el.contains(focus)||focus.contains(el)||el.closest('.tutorial-panel'))return;el.classList.add('tutorial-blocked')})}

function bindCardFx(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('pointermove',e=>{
      if(e.pointerType&&e.pointerType!=='mouse'&&e.pointerType!=='pen')return;
      const r=card.getBoundingClientRect(),px=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),py=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
      card.style.setProperty('--shine-x',(px*100).toFixed(1)+'%');
      card.style.setProperty('--shine-y',(py*100).toFixed(1)+'%');
      card.style.setProperty('--art-x',((.5-px)*5).toFixed(2)+'px');
      card.style.setProperty('--art-y',((.5-py)*3.5).toFixed(2)+'px');
      card.classList.add('fx-hover');
    });
    card.addEventListener('pointerleave',()=>{
      card.classList.remove('fx-hover');
      card.style.setProperty('--art-x','0px'); card.style.setProperty('--art-y','0px');
      card.style.setProperty('--shine-x','50%'); card.style.setProperty('--shine-y','45%');
    });
  });
}
function render(){if(!state.started){$('#app').innerHTML='';return} const p=current(),human=!p.bot,ths=p.hand.filter(id=>CARD[id].type.includes('treasure')).length,coinPulse=Date.now()<state.coinPulse?'pulse':''; $('#app').innerHTML=`<div class='app'><header class='topbar'><div class='brand'><small>Deck-building · 2–4 graczy</small><h1>OPEN DOMINION</h1></div><div class='top-actions'><button class='btn ghost' id='newGame'>Nowa gra</button><button class='btn ghost' id='openTutorial'>Samouczek</button></div></header><main class='main'><aside class='sidebar'><span class='eyebrow'>${human?'Twoja tura':'Tura bota'}</span><h2>${esc(phaseTitle())}</h2><div class='phase-copy'><p>${state.busy?'Rozpatrywanie efektu…':state.phase==='action'?'Zagraj karty Akcji z ręki. Gdy skończysz, przejdź do zakupów.':state.phase==='buy'?'Zagraj skarby pojedynczo lub wszystkie naraz, a potem kup kartę z rynku.':'Odrzucanie ręki i dobieranie nowej.'}</p></div><div class='log'><span class='eyebrow'>Dziennik</span><div class='log-items'>${state.log.map(x=>`<div class='log-item'>${esc(x)}</div>`).join('')}</div></div></aside><section class='board-shell'><div class='board'><div class='market'><h3>Rynek Królestwa</h3><div class='piles'>${KINGDOM.map(pileHtml).join('')}</div><div class='piles basic-piles'>${BASIC.map(pileHtml).join('')}</div><div class='play-area'><div class='play-title'>W grze</div><div class='played played-dropzone'>${p.play.map(id=>cardHtml(id,{zone:'played'})).join('')}</div></div><div class='hand-zone'><div class='hand-title'>${human?'Twoja ręka':`Ręka: ${p.hand.length} kart`}</div><div class='hand'>${human?p.hand.map((id,i)=>{const legal=(state.phase==='action'&&CARD[id].type.includes('action')&&state.actions>0)||(state.phase==='buy'&&CARD[id].type.includes('treasure'));return cardHtml(id,{playable:legal,zone:'hand',action:`data-play='${i}' style='--rot:${(i-(p.hand.length-1)/2)*2.4}deg;--drop:${Math.abs(i-(p.hand.length-1)/2)*2}px;--delay:${i*28}ms'`})}).join(''):''}</div></div></div><aside class='players'>${state.players.map((pl,i)=>`<div class='player-seat ${i===state.turn?'active':''}' data-seat='${i}'><h4>${esc(pl.name)}</h4><div class='seat-meta'>${pl.bot?'BOT':'GRACZ'} · talia ${pl.deck.length} · odrzucone ${pl.discard.length}</div><div class='seat-score'>${score(pl)} PZ</div><div class='seat-tray'><div class='tray-pill seat-discard'>Odrzucone ${pl.discard.length}</div><div class='tray-pill'>W grze ${pl.play.length}</div></div></div>`).join('')}<div class='supply-note'>Gra kończy się po wyczerpaniu Prowincji albo dowolnych trzech stosów. Remisy rozstrzyga mniejsza liczba tur.</div></aside></div></section></main><div class='turn-dock'><div class='resources'><div class='resource'><span>Runda</span><b>${state.round}</b></div><div class='resource'><span>Akcje</span><b>${state.actions}</b></div><div class='resource'><span>Zakupy</span><b>${state.buys}</b></div><div class='resource coins ${coinPulse}'><span>Monety</span><b>${state.coins}</b></div></div><div class='dock-status'><div class='phase-chip'><span class='phase-dot'></span>${esc(phaseTitle())}</div><p>${human?(state.phase==='action'?'Akcje z ręki zagrywasz pojedynczo.':'Monety rosną na bieżąco — możesz zagrać skarby pojedynczo lub hurtowo.'):'Bot rozgrywa swoją turę…'}</p></div><div class='dock-actions'><button class='btn treasure' id='playAllTreasures' ${!human||state.phase!=='buy'||!ths||state.busy?'disabled':''}>Zagraj wszystkie (${ths})</button><button class='btn primary' id='nextPhase' ${!human||state.busy?'disabled':''}>${state.phase==='action'?'Przejdź do zakupów':'Zakończ turę'}</button></div></div>${renderTutorialPanel()}</div>`; document.querySelectorAll('[data-play]').forEach(el=>el.onclick=()=>{const i=+el.dataset.play, id=current().hand[i];if(state.phase==='buy'&&CARD[id].type.includes('treasure'))playTreasure(i,el);else playCard(i,el)}); document.querySelectorAll('[data-buy]').forEach(el=>el.onclick=e=>buy(el.dataset.buy,e.currentTarget)); $('#nextPhase').onclick=nextPhase; $('#newGame').onclick=showSetup; $('#openTutorial').onclick=()=>{document.querySelectorAll('.overlay').forEach(x=>x.remove()); startTutorial()}; const all=$('#playAllTreasures'); if(all)all.onclick=playAllTreasures; const skip=$('#tutorialSkip'); if(skip)skip.onclick=()=>{state.tutorial.active=false;render()}; const repeat=$('#tutorialRepeat'); if(repeat)repeat.onclick=()=>render(); const close=$('#tutorialClose'); if(close)close.onclick=()=>{state.tutorial.active=false;render()}; applyTutorialFocus(); bindCardFx(); setTimeout(()=>state.lastBought=null,420)}
function showSetup(){document.querySelectorAll('.overlay').forEach(x=>x.remove());const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class='modal'><span class='eyebrow'>Nowa gra</span><h2>Zbuduj swoje królestwo</h2><p>Wybierz liczbę graczy. Pozostałe miejsca zajmą boty. Możesz też uruchomić sterowany samouczek z przykładową turą.</p><div class='setup-grid'>${[2,3,4].map(n=>`<button class='choice ${n===setupPlayers?'selected':''}' data-n='${n}'><b>${n} graczy</b><br><small>Ty + ${n-1} ${n===2?'bot':'boty'}</small></button>`).join('')}</div><div class='setup-actions'><button class='btn primary' id='start'>Rozpocznij</button><button class='btn ghost' id='startTutorial'>Samouczek</button></div></div>`;document.body.appendChild(o);o.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{setupPlayers=+b.dataset.n;o.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===b))});o.querySelector('#start').onclick=()=>{o.remove();startGame(setupPlayers)};o.querySelector('#startTutorial').onclick=()=>{o.remove();startTutorial()}}
showSetup();
})();
</script>
